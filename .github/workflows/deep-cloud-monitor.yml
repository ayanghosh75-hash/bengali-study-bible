name: BSB observed availability and integrity
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bsb-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check classification rules
        run: node --test scripts/test-observation-rules.mjs
      - name: Observe public endpoints without changing production
        run: node scripts/observe-site.mjs
      - name: Keep evidence even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsb-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ops-reports/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
  integrity:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-scripture-checksums.mjs
      - run: node scripts/verify-bible-integrity.mjs
      - run: node scripts/verify-usfm-comparison.mjs
      - run: node --test scripts/test-verse-ranges.mjs
      - run: node scripts/audit-verse-ranges.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsb-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ops-reports/
          include-hidden-files: true
          retention-days: 30
