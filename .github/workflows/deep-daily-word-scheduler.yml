name: "দীপ (Deep) 24/7 Daily Word & Outreach Scheduler"

on:
  schedule:
    # Run every hour at minute 0 (24 times a day across all time zones)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force dispatch to all timezones regardless of local hour'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (simulate without live network outbound calls)'
        required: false
        default: false
        type: boolean
      target_date:
        description: 'Specific target date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  deep-daily-dispatch:
    runs-on: ubuntu-latest
    name: "Deep Daily Word Autonomous Cloud Worker"
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts || npm install

      - name: Execute Deep Cloud Dispatcher
        env:
          DEEP_ADMIN_EMAIL: ${{ secrets.DEEP_ADMIN_EMAIL || 'ayanghosh75@gmail.com' }}
          DEEP_APPROVER: "Rev. Ayan Kumar Ghosh"
          DEEP_AUTONOMY_MODE: "TRUSTED_AUTOPILOT"
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            FLAGS="$FLAGS --date=${{ github.event.inputs.target_date }}"
          fi
          node scripts/cloud-worker/deep-daily-word-cron.mjs $FLAGS
